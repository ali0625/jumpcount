name: RopeSkipStandalone
options:
  deploymentTarget:
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
packages:
  JumpCore:
    path: Packages/JumpCore
targets:
  RopeSkipStandalone:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    dependencies:
      - package: JumpCore
        product: JumpCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ali0625.ropeskip.standalone
        INFOPLIST_KEY_CFBundleDisplayName: 跳绳计数
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSMotionUsageDescription: 用于识别跳绳动作并在手表本地保存运动记录。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ROPE_STANDALONE"
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
schemes:
  RopeSkipStandalone:
    build:
      targets:
        RopeSkipStandalone: all
