name: RopeSkipProbe
options:
  deploymentTarget:
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  RopeSkipProbe:
    type: application
    platform: watchOS
    sources: [Probe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ali0625.ropeskip.probe
        INFOPLIST_KEY_CFBundleDisplayName: 跳绳安装测试
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
schemes:
  RopeSkipProbe:
    build:
      targets:
        RopeSkipProbe: all
